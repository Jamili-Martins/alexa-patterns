spring.application.name=alexa-patterns
spring.profiles.default=dev

server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.error.include-message=never
server.error.include-stacktrace=never

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

app.jwt.secret=${ALEXA_JWT_SECRET:}
app.jwt.issuer=alexa-patterns
app.jwt.expiration=PT2H

app.admin.enabled=true
app.admin.username=${ALEXA_ADMIN_USER:}
app.admin.password=${ALEXA_ADMIN_PASSWORD:}