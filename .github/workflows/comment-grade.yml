name: Publicar nota AlexaPatterns

on:
  workflow_run:
    workflows: [Avaliação AlexaPatterns]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: alexa-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter somente o publicador oficial
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Baixar o relatório da avaliação
        uses: actions/download-artifact@v8
        with:
          name: alexa-evaluation
          path: downloaded
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar os dados e reconstruir o comentário
        run: |
          python3 trusted/.github/evaluation/grade.py \
            --render downloaded/evaluation-results/grade.json \
            --output published

      - name: Criar ou atualizar o comentário
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('published/grade.json', 'utf8'));
            const body = fs.readFileSync('published/grade.md', 'utf8');
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const number = report.pr;
            if (!Number.isInteger(number) || number < 1) {
              throw new Error('Número do PR ausente ou inválido.');
            }
            const { data: pull } = await github.rest.pulls.get({
              owner, repo, pull_number: number
            });
            const association = (run.pull_requests || []).some(pr => pr.number === number);
            const sameHead = run.head_sha === report.revision;
            const sameMerge = association && run.head_sha === pull.merge_commit_sha;
            if (pull.state !== 'open' || pull.base.repo.full_name !== `${owner}/${repo}` ||
                pull.base.ref !== context.payload.repository.default_branch ||
                pull.head.sha !== report.revision || (!sameHead && !sameMerge)) {
              core.notice('Avaliação antiga ou sem associação válida com este PR.');
              return;
            }
            const marker = '<!-- avaliador-alexapatterns -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: number, body
              });
            }